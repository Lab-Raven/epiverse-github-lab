name: LAB - Préparer une release brouillon
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Uniquement v0.0.N-lab, release interne brouillon"
        required: true
        default: v0.0.1-lab
permissions:
  contents: write
jobs:
  draft:
    if: github.repository == 'Lab-Raven/epiverse-github-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Préparer une draft prerelease (pas de publication)
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v0\.0\.[0-9]+-lab$ ]] || { echo "Tag non LAB refusé"; exit 1; }
          test "$GITHUB_REPOSITORY" = "Lab-Raven/epiverse-github-lab"
          echo "LAB public : draft seulement, aucun tag publié comme release."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "Release existante ; aucune modification"; exit 0;
          }
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease             --title "LAB $TAG — démonstration non officielle"             --notes "Release brouillon interne, sans code applicatif ni validation du projet réel. Aucune livraison produit ; archive de démonstration uniquement."
          echo "Brouillon conservé ; aucune publication automatique." >> "$GITHUB_STEP_SUMMARY"
