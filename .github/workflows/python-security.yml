name: LAB - Analyse statique Python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe de tous les scripts
        run: python -m compileall -q scripts tests
      - name: Installer Bandit (analyse SAST Python)
        run: python -m pip install --disable-pip-version-check bandit==1.8.6
      - name: Exécuter l'analyse sécurité (medium/high)
        run: bandit -q -r scripts -ll
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
